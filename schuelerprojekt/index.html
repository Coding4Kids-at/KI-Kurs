<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TIPP: Ändere den Titel hier! -->
  <title>Mein KI-Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 600px;
      overflow: hidden;
    }

    /* TIPP: Ändere die Farbe hier! */
    .header {
      background: #0284c7;
      color: white;
      padding: 16px 20px;
      font-weight: 600;
      font-size: 1rem;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.875rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.user {
      background: #0284c7;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      background: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.loading {
      opacity: 0.6;
    }

    .input-row {
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #0284c7; }

    button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <!-- TIPP: Ändere den Bot-Namen hier! -->
    <div class="header">Mein KI-Bot</div>

    <div class="messages" id="messages">
      <!-- TIPP: Ändere die Willkommensnachricht! -->
      <div class="msg bot">Hallo! Wie kann ich dir helfen?</div>
    </div>

    <div class="input-row">
      <input
        id="input"
        type="text"
        placeholder="Schreib etwas..."
        onkeydown="if(event.key==='Enter') send()"
      />
      <button id="btn" onclick="send()">&#10148;</button>
    </div>
  </div>

  <script>
    // Die Adresse deines Backends — ändere nur wenn nötig
    const API_URL = 'http://localhost:3002/api/chat'

    async function send() {
      const input = document.getElementById('input')
      const btn = document.getElementById('btn')
      const text = input.value.trim()
      if (!text) return

      input.value = ''
      btn.disabled = true

      addMessage(text, 'user')

      const loading = addMessage('...', 'bot loading')

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        })
        const data = await res.json()
        loading.textContent = data.antwort || data.error || 'Fehler'
        loading.classList.remove('loading')
      } catch (e) {
        loading.textContent = 'Fehler: Backend nicht erreichbar. Läuft server.js?'
        loading.classList.remove('loading')
      }

      btn.disabled = false
      input.focus()
    }

    function addMessage(text, type) {
      const div = document.createElement('div')
      div.className = 'msg ' + type
      div.textContent = text
      const messages = document.getElementById('messages')
      messages.appendChild(div)
      messages.scrollTop = messages.scrollHeight
      return div
    }
  </script>
</body>
</html>
